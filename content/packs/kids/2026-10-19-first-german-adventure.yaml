  Kids mode: a short, audio-only, playful session for a young beginner who
  doesn't read yet. Everything is taught by ear through repetition, sound
  effects, and copying - no reading required.

  To use: set the learner_name above (the UI's profile popover doesn't edit
  this field yet - edit the YAML directly, or open the pack and save it
  again once you've set it via a future name field). Try the other five
  Kids mode scenarios (treasure hunt, birthday counting, bedtime story,
  snack time, superhero rescue) by changing the scenario id above or
  picking them from the Scene tab.
