<?xml version="1.0" encoding="UTF-8"?>
<!-- Lingo Dojo app icon: a gold torii gate against a red sun, with a white
     speech bubble between the pillars (a conversation inside the dojo), on a
     deep indigo rounded tile. Flat shapes only; sips rasterizes via
     CoreGraphics' basic SVG support, so no filters, no text. Rendered to
     icon-1024.png by render-icon.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="#1b1f3a"/>
  <!-- rising sun -->
  <circle cx="512" cy="470" r="250" fill="#b8322b"/>
  <!-- torii, gold -->
  <g fill="#f2b949">
    <!-- kasagi: top beam, ends sweep upward -->
    <path d="M150 262 Q512 322 874 262 L874 338 Q512 398 150 338 Z"/>
    <!-- pillars -->
    <rect x="292" y="330" width="78" height="470"/>
    <rect x="654" y="330" width="78" height="470"/>
    <!-- nuki: lower beam -->
    <rect x="232" y="430" width="560" height="54"/>
    <!-- gakuzuka: centre tablet between beams -->
    <rect x="487" y="368" width="50" height="62"/>
    <!-- plinths -->
    <rect x="264" y="800" width="134" height="40" rx="8"/>
    <rect x="626" y="800" width="134" height="40" rx="8"/>
  </g>
  <!-- speech bubble between the pillars -->
  <g fill="#f5f1e8">
    <rect x="392" y="540" width="240" height="150" rx="44" ry="44"/>
    <path d="M430 672 L418 736 L488 684 Z"/>
  </g>
  <g fill="#1b1f3a">
    <circle cx="462" cy="615" r="19"/>
    <circle cx="512" cy="615" r="19"/>
    <circle cx="562" cy="615" r="19"/>
  </g>
</svg>
